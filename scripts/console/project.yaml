# Everything project-specific for the factory console. See scripts/console/README.md for the
# full key reference and how to install the console into another repository.

name: munserv
port: 3999
accent: "#233D36" # design/tokens/color.tokens.json: brand.primary
checkout_dir: munserv-console
handoff_glob: specs/features
story_label_prefix: "story:"

domain_language: domain/language.yaml
requirements_dir: specs/requirements
adr_dir: specs/architecture/decisions
registry_dir: design/registry
canvases_dir: design/canvases
tokens: design/tokens/color.tokens.json
changelog: CHANGELOG.md

links:
  Pages dashboard: https://ossewawiel.github.io/munserv/dashboard/
  Board: https://github.com/users/ossewawiel/projects/5
  Storybook (local): http://localhost:6006
  Widgetbook (local): http://localhost:7701
  Swagger: http://localhost:8080/swagger-ui.html

# Remote eyeball: the console listens on `bind`, every non-loopback request needs the token in
# `token_file` (created on first start), and the services bind the LAN too. `--local` turns it off.
remote:
  enabled: true
  bind: 0.0.0.0
  ports:
    web: 3000
    backend: 8080
    console: 3999
  swagger_path: /swagger-ui.html
  ensure_services: [db, backend, web]

# Showcase stack (scripts/console/showcase.py): a second, independent run of origin/master for demos.
# Ports here must match the demo-* entries in services.yaml and backend application-demo.yml.
showcase:
  checkout_dir: munserv-demo
  database: munserv_demo
  backend_port: 8090
  web_port: 4000
  db_host: localhost
  db_port: 5435
  db_user: munserv
  db_password: munserv_dev

sections:
  overview: true
  knowledge: true
  design: true
  eyeball: true
  release: true
  cost: true
