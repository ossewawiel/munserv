# Services the console can prepare/start/stop/health-check in the checkout under test. `cwd` is
# relative to that checkout. `health` is a URL (HTTP 2xx/3xx = up) or `tcp:<port>`. Services with
# `manual: true` are not started by the console; they are listed so the panel can show what the
# tester must start themselves. `stop` is a real shell command, run in `cwd`, used only when there
# is no tracked process to kill (a `start` that detaches, like `docker compose up -d`, which exits
# immediately on its own); everything the console starts as a foreground process is stopped by
# killing its process group, with no `stop` command needed.
#
# `prepare` (optional) describes the background step that gets a fresh checkout ready before
# `start` can succeed: `marker` is a path (relative to `cwd`) whose absence means prepare is
# needed; `newer_than` (optional) is a second path that, when newer than `marker`, also means
# prepare is needed (a lockfile bumped since the last install); `command` is the shell command to
# run; `copy` is a list of {src (relative to the repo root), dest (relative to `cwd`)} files
# copied in only when `dest` does not already exist.
#
# `start`, `url` and `notes` may use placeholders, filled in by remote.py: `{bind}` (the address a
# dev server listens on: 0.0.0.0 in remote mode, localhost otherwise), `{host}` (what a browser
# calls this machine: its LAN address in remote mode, localhost otherwise), `{hostname}` (the
# machine's hostname, for dev servers that check the Host header) and `{api_base}` (empty in remote
# mode so the web client calls its own origin; the backend's localhost URL otherwise).
# `detached: true` marks a service whose start command exits at once (docker compose up -d): ensure
# keeps it while it is healthy and never restarts it because the checkout moved.
# `start_timeout` is the seconds ensure waits for the service to turn healthy after starting it.

db:
  cwd: infrastructure/docker
  start: docker compose up -d
  stop: docker compose stop
  detached: true
  start_timeout: 60
  health: "tcp:5435"
  url: "postgresql://localhost:5435"

backend:
  cwd: backend
  # The local profile is required: bootstrap.super-user (application-local.yml) only loads under
  # it, and BootstrapConfig.enabled defaults to false without it, so the super_user account and
  # W22-W24/W29/W30-style checks cannot be exercised on a backend started any other way.
  # The mailpit profile sends every e-mail to the Mailpit container the db service starts, so
  # member approval works offline (read the mail at http://localhost:8026).
  # MUNSERV_APP_ADMIN_PORTAL_URL is the web URL e-mailed links point at.
  start: MUNSERV_APP_ADMIN_PORTAL_URL=http://{host}:3000 SPRING_PROFILES_ACTIVE=local,mailpit ./gradlew bootRun
  start_timeout: 300
  # The liveness group answers in milliseconds; the full health endpoint aggregates every indicator.
  health: http://localhost:8080/actuator/health/liveness
  url: http://{host}:8080
  prepare:
    copy:
      - src: backend/src/main/resources/application-local.yml
        dest: src/main/resources/application-local.yml

web:
  cwd: web
  # The web client falls back to the mock API on 3001 unless VITE_API_URL is set; a fresh
  # checkout has no .env, so point it at the backend explicitly. In remote mode the URL is
  # relative (/api/v1) and the Vite proxy forwards it to the backend.
  start: VITE_API_URL={api_base}/api/v1 __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS={hostname} pnpm dev --host {bind}
  start_timeout: 120
  health: http://localhost:3000
  url: http://{host}:3000
  prepare:
    marker: node_modules
    newer_than: pnpm-lock.yaml
    command: pnpm install --frozen-lockfile

storybook:
  cwd: web
  start: VITE_API_URL=http://localhost:8080/api/v1 pnpm storybook
  health: http://localhost:6006
  url: http://localhost:6006
  prepare:
    marker: node_modules
    newer_than: pnpm-lock.yaml
    command: pnpm install --frozen-lockfile

mock-api:
  cwd: infrastructure/mock-api
  start: npm start
  health: http://localhost:3001
  url: http://localhost:3001
  prepare:
    marker: node_modules
    command: npm install

mobile:
  cwd: mobile
  start: flutter run
  manual: true
  # `emulator_host`/`api_port` are read by scripts/console/mobile.py for the Phone panel's own
  # --dart-define values (a phone gets this machine's LAN address instead of emulator_host); kept
  # here, not hardcoded in mobile.py, so a project using this console for a different backend port
  # or emulator convention stays correct without a code change. See mobile/CLAUDE.md and
  # mobile/lib/shared/providers/dio_provider.dart for the --dart-define=API_HOST/API_PORT contract.
  emulator_host: "10.0.2.2"
  api_port: 8080
  notes: >-
    The emulator reaches the backend on 10.0.2.2:8080; run and stop it yourself in a terminal.
    A physical phone can be installed and run from the Eyeball page's Phone panel instead.
  prepare:
    marker: .dart_tool
    command: flutter pub get
