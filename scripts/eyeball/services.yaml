# Services the eyeball dashboard can start/stop/health-check in the checkout under test.
# `cwd` is relative to that checkout. `health` is a URL (HTTP 2xx/3xx = up) or `tcp:<port>`.
# Services with `manual: true` are not started by the dashboard; they are listed so the checklist
# can show what the tester must start themselves. `stop` is a real shell command, run in `cwd`,
# used only when there is no tracked process to kill (a `start` that detaches, like `docker compose
# up -d`, which exits immediately on its own); everything the dashboard starts as a foreground
# process is stopped by killing its process group, with no `stop` command needed.

db:
  cwd: infrastructure/docker
  start: docker compose up -d
  stop: docker compose stop
  health: "tcp:5435"
  url: "postgresql://localhost:5435"

backend:
  cwd: backend
  # The local profile is required: bootstrap.super-user (application-local.yml) only loads under
  # it, and BootstrapConfig.enabled defaults to false without it, so the super_user account and
  # W22-W24/W29/W30-style checks cannot be exercised on a backend started any other way.
  start: SPRING_PROFILES_ACTIVE=local ./gradlew bootRun
  health: http://localhost:8080/actuator/health
  url: http://localhost:8080

web:
  cwd: web
  start: pnpm dev
  health: http://localhost:3000
  url: http://localhost:3000

storybook:
  cwd: web
  start: pnpm storybook
  health: http://localhost:6006
  url: http://localhost:6006

mock-api:
  cwd: infrastructure/mock-api
  start: npm start
  health: http://localhost:3001
  url: http://localhost:3001

mobile:
  cwd: mobile
  start: flutter run
  manual: true
  notes: The emulator reaches the backend on 10.0.2.2:8080. Run and stop this yourself in a terminal.
