# Services the eyeball dashboard can start/stop/health-check in the checkout under test.
# `cwd` is relative to that checkout. `health` is a URL (HTTP 2xx/3xx = up) or `tcp:<port>`.
# Services with `manual: true` are not started by the dashboard; they are listed so the checklist
# can show what the tester must start themselves.

db:
  cwd: infrastructure/docker
  start: docker compose up -d
  stop: docker compose stop
  health: "tcp:5435"
  url: "postgresql://localhost:5435"
  log: db

backend:
  cwd: backend
  start: ./gradlew bootRun
  stop: (stop the process group)
  health: http://localhost:8080/actuator/health
  url: http://localhost:8080
  log: backend

web:
  cwd: web
  start: pnpm dev
  stop: (stop the process group)
  health: http://localhost:3000
  url: http://localhost:3000
  log: web

storybook:
  cwd: web
  start: pnpm storybook
  stop: (stop the process group)
  health: http://localhost:6006
  url: http://localhost:6006
  log: storybook

mock-api:
  cwd: infrastructure/mock-api
  start: npm start
  stop: (stop the process group)
  health: http://localhost:3001
  url: http://localhost:3001
  log: mock-api

mobile:
  cwd: mobile
  start: flutter run
  stop: (stop the app from the device/emulator or Ctrl-C in its terminal)
  manual: true
  notes: The emulator reaches the backend on 10.0.2.2:8080. Run this yourself in a terminal.
