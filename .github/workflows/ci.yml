name: CI

# A PR that changes this file waits for the owner: see ci-edit-guard.yml (#294).

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
    # No `labeled`: a label run would cancel the running pull_request run. baseline-guard.yml, the
    # CI edit guard and the infra review guard read labels, each in its own check (#301).
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to smoke-test
        default: master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'specs/contracts/openapi.json'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'scripts/console/accounts.yaml'
              - 'scripts/check-no-demo-accounts.py'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - 'scripts/console/accounts.yaml'
              - 'scripts/check-no-demo-accounts.py'
              - '.github/workflows/ci.yml'

  domain:
    name: Domain language and guardrails
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Test the handoff lint
        run: python3 scripts/test-lint-handoffs.py
      - name: Lint the Eyeball block of every new handoff
        run: python3 scripts/lint-handoffs.py --changed-since origin/master
      - name: Lint the CLAUDE.md cards
        run: python3 scripts/lint-handoffs.py --cards
      - name: Test the requirements status check
        run: python3 scripts/test-render-requirements.py
      - name: Requirement rows this branch changed match GitHub issues
        run: python3 scripts/render-requirements.py --check --changed-since origin/master
        env:
          GH_TOKEN: ${{ github.token }}
      - name: One error body type in the backend
        # The wire has one error body, com.munserv.shared.api.ErrorResponse. The two allowlisted
        # duplicates are #246; remove each line here when #246 deletes the class.
        run: |
          extra=$(grep -rlE --include='*.kt' '^(data )?class ErrorResponse\b' backend/src/main \
            | grep -vxF \
                -e backend/src/main/kotlin/com/munserv/shared/api/ErrorResponse.kt \
                -e backend/src/main/kotlin/com/munserv/auth/api/AuthResponse.kt \
                -e backend/src/main/kotlin/com/munserv/pod/api/PodController.kt \
            || true)
          if [ -n "$extra" ]; then
            echo "A new ErrorResponse class puts another error shape on the wire. Use com.munserv.shared.api.ErrorResponse:"
            echo "$extra"
            exit 1
          fi
      - name: Validate domain/language.yaml against the code
        run: python3 scripts/validate-domain-language.py
      - name: Test the git guard hook
        run: python3 scripts/test-hooks.py
      - name: Test the stop-gate hook
        run: .claude/hooks/tests/verify-platform-cases.sh
      - name: Test the CI edit guard
        run: python3 scripts/test-ci-edit-guard.py
      - name: Test the infra review guard
        run: python3 scripts/test-infra-review-guard.py
      - name: Test the baseline guard
        run: python3 scripts/test-baseline-guard.py
      - name: Test the CI status job
        run: python3 scripts/test-ci-status.py
      - name: Test the CI watcher
        run: python3 scripts/test-watch-ci.py
      - name: Test the operator TUI
        run: pip install --quiet textual==8.2.8 && python3 scripts/test-tui.py
      - name: Test the quick-login input generator
        run: python3 scripts/test-demo-accounts.py
      - name: Test the demo-account build check
        run: python3 scripts/test-check-no-demo-accounts.py
      - name: Test the factory tick
        run: python3 scripts/test-factory-tick.py
      - name: Test the retro evidence gatherer
        run: python3 scripts/test-retro-gather.py

  design:
    name: Design tokens
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: design/pnpm-lock.yaml
      - name: Install
        run: pnpm --dir design install --frozen-lockfile
      - name: Generated theme files match the tokens
        run: pnpm --dir design check

  backend:
    name: Backend (Kotlin)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew ktlintCheck --no-daemon
      - name: Test (unit + integration via Testcontainers)
        run: ./gradlew test --no-daemon
      - name: Build
        run: ./gradlew build -x test --no-daemon
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/build/reports/tests/test
            backend/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: ignore

  web:
    name: Web (React)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test:run
      - name: Build
        run: pnpm build
      - name: No demo account in the production bundle
        run: python3 ../scripts/check-no-demo-accounts.py dist

  visual-web:
    name: Visual regression (Storybook)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm build-storybook
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Visual regression
        run: pnpm test:visual
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-web-report
          path: web/playwright-report-visual
          if-no-files-found: ignore

  mobile:
    name: Mobile (Flutter)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Install
        run: flutter pub get
      - name: Format check
        run: dart format --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: No demo account in the APK
        run: python3 ../scripts/check-no-demo-accounts.py build/app/outputs/flutter-apk/app-debug.apk

  # After a merge to master (and on demand): run every probe check of the completed handoffs and
  # scripts/console/smoke.yaml against a live backend. Auto-merge can land a PR before a review or
  # eyeball verdict arrives, so this re-proves what is now on master. A failure opens or updates one
  # `source:smoke` bug per check. Not part of `CI status`: it never gates a PR.
  smoke:
    name: Smoke (master)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BACKEND_LOG: ${{ github.workspace }}/backend-smoke.log
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Start the database
        run: docker compose -f infrastructure/docker/docker-compose.yml up -d --wait postgres
      - name: Start the backend (local profile)
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: local
        run: |
          nohup ./gradlew bootRun --no-daemon > "$BACKEND_LOG" 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health/liveness > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "backend did not come up in 180 s"; tail -n 60 "$BACKEND_LOG"; exit 1
      - name: Run the probe checks
        run: |
          python3 -m scripts.console.smoke_run --file-issues \
            --commit "$(git rev-parse HEAD)" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Upload the backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-backend-log
          path: backend-smoke.log
          if-no-files-found: ignore

  # Single required status check for branch protection. Passes when `changes` succeeded and every
  # triggered job passed. `changes` must be `success` and not `skipped`: when it fails, GitHub skips
  # the platform jobs that need it, and a skipped job counts as passed in the loop below (#306).
  # scripts/test-ci-status.py runs this step for each job in `needs`.
  ci-status:
    name: CI status
    needs: [changes, domain, design, backend, web, visual-web, mobile]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate
        run: |
          echo "changes=${{ needs.changes.result }} domain=${{ needs.domain.result }} design=${{ needs.design.result }} backend=${{ needs.backend.result }} web=${{ needs.web.result }} visual-web=${{ needs.visual-web.result }} mobile=${{ needs.mobile.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Detect changes did not pass, so no platform job ran: ${{ needs.changes.result }}"
            exit 1
          fi
          for r in "${{ needs.domain.result }}" "${{ needs.design.result }}" "${{ needs.backend.result }}" "${{ needs.web.result }}" "${{ needs.visual-web.result }}" "${{ needs.mobile.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "A platform job did not pass: $r"; exit 1 ;;
            esac
          done
