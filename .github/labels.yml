# GitHub Labels Configuration for MunServ
# Apply with: gh label import .github/labels.yml
# Or use: scripts/setup-github-labels.sh

# ============================================
# TYPE LABELS (What kind of work is this?)
# ============================================
- name: "type:feature"
  color: "0E8A16"
  description: "New functionality or user story"

- name: "type:bug"
  color: "D73A4A"
  description: "Something isn't working correctly"

- name: "type:docs"
  color: "0075CA"
  description: "Documentation improvements"

- name: "type:standards"
  color: "FBCA04"
  description: "Coding standards or architecture violation"

- name: "type:tech-debt"
  color: "5319E7"
  description: "Technical debt to address"

- name: "type:chore"
  color: "EDEDED"
  description: "Maintenance tasks (dependencies, CI, etc.)"

# ============================================
# PLATFORM LABELS (Where does this apply?)
# ============================================
- name: "platform:backend"
  color: "7057FF"
  description: "Affects Kotlin/Spring Boot backend"

- name: "platform:web"
  color: "008672"
  description: "Affects React/TypeScript web admin"

- name: "platform:mobile"
  color: "0366D6"
  description: "Affects Flutter mobile app"

- name: "platform:database"
  color: "B60205"
  description: "Affects database schema or migrations"

- name: "platform:infra"
  color: "6F42C1"
  description: "Affects infrastructure or DevOps"

# ============================================
# STATUS LABELS (Where is this in the pipeline?)
# ============================================
- name: "status:triage"
  color: "FFFFFF"
  description: "Needs review and prioritization"

- name: "status:ready"
  color: "C2E0C6"
  description: "Ready to be picked up"

- name: "status:in-progress"
  color: "FEF2C0"
  description: "Currently being worked on"

- name: "status:blocked"
  color: "F9D0C4"
  description: "Blocked by dependency or question"

- name: "status:review"
  color: "BFDADC"
  description: "PR open, awaiting review"

- name: "status:done"
  color: "0E8A16"
  description: "Completed and merged"

# ============================================
# PRIORITY LABELS (How urgent?)
# ============================================
- name: "priority:critical"
  color: "B60205"
  description: "Blocking release or other work"

- name: "priority:high"
  color: "D93F0B"
  description: "Must have for next release"

- name: "priority:medium"
  color: "FBCA04"
  description: "Should have"

- name: "priority:low"
  color: "0E8A16"
  description: "Nice to have"

# ============================================
# SOURCE LABELS (Where did this come from?)
# ============================================
- name: "source:agent-requested"
  color: "1D76DB"
  description: "Created by Claude agent"

- name: "source:user-requested"
  color: "BFD4F2"
  description: "Created by human user"

- name: "source:spec-derived"
  color: "D4C5F9"
  description: "Derived from spec documents"

- name: "source:automated"
  color: "EDEDED"
  description: "Created by automated workflow"

