name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report
        Use this template to report bugs in MunServ.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform(s) does this bug affect?
      multiple: true
      options:
        - Backend
        - Web
        - Mobile
        - Database
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - "Low - Minor inconvenience"
        - "Medium - Feature partially broken"
        - "High - Feature completely broken"
        - "Critical - System down or data loss"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear description of what's wrong
      placeholder: "When I try to... the system..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the bug
      placeholder: |
        1. Navigate to...
        2. Click on...
        3. Enter...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: "The system should..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
      placeholder: "Instead, the system..."
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant environment details
      placeholder: |
        - Browser/Device: Chrome 120 / iPhone 15
        - OS: macOS 14.2 / iOS 17
        - Backend version: v1.2.3
        - Database: PostgreSQL 15
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs/Screenshots
      description: Include relevant logs, error messages, or screenshots
      placeholder: |
        ```
        Error log here...
        ```
    validations:
      required: false

  - type: input
    id: handoff-doc
    attributes:
      label: Handoff Document
      description: Link to handoff document if this came from agent investigation
      placeholder: "specs/features/feature-name/bug-handoff.md"
    validations:
      required: false

  - type: textarea
    id: related
    attributes:
      label: Related Issues
      description: Link to related issues
      placeholder: |
        - Related: #123
        - Regression from: #100
    validations:
      required: false
