# git-cliff configuration for MunServ
# https://git-cliff.org/docs/configuration

[changelog]
# Changelog header
header = """
# Changelog

All notable changes to MunServ will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""

# Template for changelog body
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.github.pr_number %} ([#{{ commit.github.pr_number }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/pull/{{ commit.github.pr_number }})){% endif %}\
            {% if commit.github.username %} by @{{ commit.github.username }}{% endif %}
    {% endfor %}
{% endfor %}\n
"""

# Template for changelog footer
footer = """
---
*Generated with [git-cliff](https://git-cliff.org/)*
"""

# Remove leading/trailing whitespace
trim = true

# Post-processors for message normalization
postprocessors = [
    # Remove conventional commit prefixes that were already parsed
    { pattern = '^(feat|fix|docs|style|refactor|perf|test|chore)\([^)]*\):\s*', replace = "" },
    { pattern = '^(feat|fix|docs|style|refactor|perf|test|chore):\s*', replace = "" },
]

[git]
# Parse conventional commits
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    # Features
    { message = "^feat", group = "Features" },

    # Bug Fixes
    { message = "^fix", group = "Bug Fixes" },

    # Documentation
    { message = "^docs", group = "Documentation" },

    # Styling
    { message = "^style", group = "Styling" },

    # Refactoring
    { message = "^refactor", group = "Refactoring" },

    # Performance
    { message = "^perf", group = "Performance" },

    # Testing
    { message = "^test", group = "Testing" },

    # Chores
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps\\)", group = "Dependencies" },
    { message = "^chore\\(changelog\\)", skip = true },
    { message = "^chore", group = "Miscellaneous" },

    # Build
    { message = "^build", group = "Build System" },

    # CI
    { message = "^ci", group = "CI/CD" },

    # Revert
    { message = "^revert", group = "Reverted" },

    # Story references (M1, W5, etc.)
    { body = "\\[M[0-9]+\\]", group = "Mobile" },
    { body = "\\[W[0-9]+\\]", group = "Web Admin" },

    # Default - skip
    { message = ".*", group = "Other" },
]

# Filter commits to include
filter_commits = false
topo_order = false
sort_commits = "oldest"

# Protect breaking changes
protect_breaking_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""

[remote.github]
owner = ""
repo = ""
