# SonarQube Configuration for MunServ Web
sonar.projectKey=munserv-web
sonar.projectName=MunServ Web
sonar.projectVersion=1.0

# Server
sonar.host.url=http://localhost:9000
sonar.token=squ_587cfc0019799be65ad1b695c3e922de370ca68c

# Sources
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/dist/**

# Tests
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# TypeScript/JavaScript
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
