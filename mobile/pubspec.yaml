name: munserv_mobile
description: "Municipal Service Issue Tracker - Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Code Generation / Immutability
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^17.0.1

  # i18n
  intl: ^0.20.2

  # Persistence
  shared_preferences: ^2.2.2

  # Security / Auth
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8

  # UI
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Testing
  mocktail: ^1.0.4

  # Linting
  flutter_lints: ^6.0.0

  # Code Generation - using latest versions for Dart 3.10 compatibility
  build_runner: ^2.4.15
  freezed: ^3.2.3
  json_serializable: ^6.9.5
  riverpod_generator: ^3.0.3
  riverpod_lint: ^3.0.3
  network_image_mock: ^2.1.1

flutter:
  uses-material-design: true
  generate: true  # Enables automatic localization code generation
