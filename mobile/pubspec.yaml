name: munserv_mobile
description: "Municipal Service Issue Tracker - Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Code Generation / Immutability
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Networking
  dio: ^5.11.1

  # Routing
  go_router: ^18.0.1

  # i18n
  intl: ^0.20.3

  # Persistence
  shared_preferences: ^2.5.5

  # Security / Auth
  flutter_secure_storage: ^11.0.0
  local_auth: ^3.0.2

  # Validation
  email_validator: ^3.0.0

  # UI
  cupertino_icons: ^1.0.9
  image_picker: ^1.2.3
  http_parser: ^4.1.2
  google_fonts: ^8.2.1

  # Maps
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Location
  geolocator: ^14.0.3
  photo_view: ^0.15.0

  # Component catalogue
  widgetbook_annotation: ^3.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # App Icon Generation
  flutter_launcher_icons: ^0.14.4

  # Testing
  mocktail: ^1.0.5

  # Linting
  flutter_lints: ^6.0.0

  # Code Generation - using latest versions for Dart 3.10 compatibility
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  network_image_mock: ^2.1.1

  # Component catalogue
  widgetbook: ^3.25.0
  widgetbook_generator: ^3.24.0

flutter:
  uses-material-design: true
  generate: true  # Enables automatic localization code generation

  assets:
    - assets/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#D9613F"  # Terracotta
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
