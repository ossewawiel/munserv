name: munserv_mobile
description: "Municipal Service Issue Tracker - Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Code Generation / Immutability
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^17.0.1

  # i18n
  intl: ^0.20.2

  # Persistence
  shared_preferences: ^2.2.2

  # Security / Auth
  flutter_secure_storage: ^9.0.0
  local_auth: ^3.0.0

  # Validation
  email_validator: ^2.1.17

  # UI
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  http_parser: ^4.1.2
  google_fonts: ^6.3.3

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Location
  geolocator: ^13.0.2
  photo_view: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # App Icon Generation
  flutter_launcher_icons: ^0.14.3

  # Testing
  mocktail: ^1.0.4

  # Linting
  flutter_lints: ^6.0.0

  # Code Generation - using latest versions for Dart 3.10 compatibility
  build_runner: ^2.4.15
  freezed: ^3.2.3
  json_serializable: ^6.9.5
  riverpod_generator: ^3.0.3
  riverpod_lint: ^3.0.3
  network_image_mock: ^2.1.1

flutter:
  uses-material-design: true
  generate: true  # Enables automatic localization code generation

  assets:
    - assets/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#D9613F"  # Terracotta
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
