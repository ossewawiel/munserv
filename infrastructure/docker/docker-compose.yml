services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: munserv-db
    environment:
      POSTGRES_USER: munserv
      POSTGRES_PASSWORD: munserv_dev
      POSTGRES_DB: munserv_dev
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munserv"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Catches all mail from a backend run with the mailpit profile (SPRING_PROFILES_ACTIVE=local,mailpit).
  # 1026/8026 rather than Mailpit's 1025/8025 defaults, which other local projects often hold.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: munserv-mail
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"

  # Collects Claude Code's OTLP metrics and logs for the console's Cost section:
  # `docker compose --profile telemetry up -d`. Writes metrics.jsonl and logs.jsonl under
  # infrastructure/telemetry/data (gitignored). Localhost only; 4318 is the OTLP/HTTP default.
  otel-collector:
    profiles: ["telemetry"]
    image: otel/opentelemetry-collector-contrib:0.141.0
    container_name: munserv-otel
    user: "${TELEMETRY_UID:-1000}:${TELEMETRY_GID:-1000}"
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - ../telemetry/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - ../telemetry/data:/data

volumes:
  pgdata:
