# Test environment configuration
spring:
  datasource:
    url: jdbc:tc:postgis:15-3.3:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: test-secret-key-for-testing-purposes-only-must-be-256-bits-long
  access-token-expiry: 86400000
  refresh-token-expiry: 7776000000
  temp-token-expiry: 600000

otp:
  expiry-seconds: 300
  length: 6
  log-to-console: true

storage:
  type: local
  local:
    upload-dir: ./build/test-uploads

logging:
  level:
    com.munserv: WARN
    org.testcontainers: WARN
