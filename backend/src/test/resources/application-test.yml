# Test environment configuration
# Uses docker-compose containers (must be running: cd infrastructure/docker && docker compose up -d)
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/munserv_dev
    username: munserv
    password: munserv_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

  data:
    redis:
      host: localhost
      port: 6379

  # Mail configuration for tests (uses mock)
  mail:
    host: localhost
    port: 3025
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

jwt:
  secret: test-secret-key-for-testing-purposes-only-must-be-256-bits-long
  access-token-expiry: 86400000
  refresh-token-expiry: 7776000000
  temp-token-expiry: 600000

otp:
  expiry-seconds: 300
  length: 6
  log-to-console: true

storage:
  type: local
  local:
    upload-dir: ./build/test-uploads

logging:
  level:
    com.munserv: WARN
    org.testcontainers: WARN

munserv:
  email:
    from: test@munserv.app
    override-recipient: test-catchall@munserv.local  # Redirect all test emails
  app:
    name: MunServ Test
    download-url: https://test.munserv.app/download
