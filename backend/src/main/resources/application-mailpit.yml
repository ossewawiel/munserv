# Layered on top of the local profile (SPRING_PROFILES_ACTIVE=local,mailpit): every e-mail goes
# to the Mailpit container in infrastructure/docker, so flows that send mail (member approval,
# admin onboarding) work offline. Read the mail with the curl commands in infrastructure/CLAUDE.md.
spring:
  mail:
    host: localhost
    port: 1026
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

munserv:
  email:
    # Mailpit catches every address, so keep the real recipient on each message.
    override-recipient: ""
