spring:
  application:
    name: munserv-api

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/munserv_dev}
    username: ${DB_USER:munserv}
    password: ${DB_PASSWORD:munserv_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-in-production-must-be-at-least-256-bits}
  access-token-expiry: 86400000    # 24 hours in milliseconds
  refresh-token-expiry: 7776000000 # 90 days in milliseconds
  temp-token-expiry: 600000        # 10 minutes in milliseconds

otp:
  expiry-seconds: 300  # 5 minutes
  length: 6
  log-to-console: true  # Development only - log OTP instead of sending SMS

logging:
  level:
    com.munserv: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.web.servlet.DispatcherServlet: DEBUG
